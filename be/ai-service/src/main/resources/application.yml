server:
  port: 8085

spring:
  application:
    name: ai-service

  datasource:
    url: jdbc:postgresql://localhost:5433/car_db
    username: p2p_admin
    password: secretpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# GOOGLE GEMINI
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.1f
            api-key: ${spring.ai.google.genai.api-key}
        embedding:
          text:
            options:
              model: gemini-embedding-001
          api-key: ${spring.ai.google.genai.api-key}
    # Qdrant
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: car_vectors
        initialize-schema: true