server:
  port: 8085

service:
  user:
    url: http://localhost:8081
  car:
    url: http://localhost:8082
  booking:
    url: http://localhost:8083
  payment:
    url: http://localhost:8084

spring:
  application:
    name: report-service

  datasource:
    url: jdbc:postgresql://localhost:5433/report_db
    username: p2p_admin
    password: secretpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

