version: '3.8'

services:
  # ==========================================
  # 1. DATABASE: POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: p2p_postgres
    restart: always
    environment:
      POSTGRES_USER: p2p_admin
      POSTGRES_PASSWORD: secretpassword
      # Mặc định tạo DB này trước, sau đó chạy init-db.sql để tạo các DB khác
      POSTGRES_DB: default_db
    ports:
      - "5433:5432"
    volumes:
      # Map script sql vào thư mục khởi tạo của container
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      # Map data ra ngoài để không mất dữ liệu khi tắt Docker
      - pgdata:/var/lib/postgresql/data
    networks:
      - p2p_network

  # Giao diện quản lý Database trên Web (Port 5050)
  pgadmin:
    image: dpage/pgadmin4
    container_name: p2p_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@p2p.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - p2p_network

  # Vector Database (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: p2p_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

# ==========================================
# KHAI BÁO NETWORK VÀ VOLUMES CHUNG
# ==========================================
networks:
  p2p_network:
    driver: bridge

volumes:
  pgdata:
  qdrant_data: